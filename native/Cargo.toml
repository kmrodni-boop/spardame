[package]
name = "spardame"
version = "1.0.4"
edition = "2021"
description = "Spardame and Hearts card game for Linux"
license = "MIT"
authors = ["Kai Marius Alm <235362284+kmrodni-boop@users.noreply.github.com>"]
homepage = "https://github.com/kmrodni-boop/spardame"

[[bin]]
name = "spardame"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
