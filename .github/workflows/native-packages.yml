name: Native packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Build .deb
        run: native/packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: native/dist/*.deb

  appimage:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev fuse libfuse2 curl
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: native/packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: native/dist/*.AppImage

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Spardame-1.1.1.flatpak
          manifest-path: native/flatpak/no.spardame.app.yml
          cache-key: flatpak-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Spardame-1.1.1.flatpak

  release:
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.deb.result == 'success'
    needs: [deb, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Native GTK 4 Spardame / Hearts — not the Electron build.

            - **`.deb`** — smallest, uses GTK already on Pop!_OS
            - **`.flatpak`** — portable, sandbox, GNOME runtime
            - **`.AppImage`** — one file; GTK 4 AppImages can be picky

            ```bash
            sudo dpkg -i spardame_1.1.1_amd64.deb
            # or
            flatpak install --user Spardame-1.1.1.flatpak
            ```
